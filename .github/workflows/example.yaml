name: Example - convert image for Kubernetes image volumes

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set image tag
        run: |
          DATE=$(date +%Y%m%d)
          REV=$((GITHUB_RUN_NUMBER))

          echo "DATE=$DATE" >> "$GITHUB_ENV"
          echo "REV=$REV" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=main-$DATE-$REV" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx (multi-platform builder)
        id: buildx
        uses: docker/setup-buildx-action@v2
        with:
          install: true

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v4
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./test/Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}-test:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Inspect original image platform
        run: |
          docker inspect ghcr.io/${{ github.repository }}-test:${{ env.IMAGE_TAG }} \
            --format 'original: architecture={{.Architecture}} os={{.Os}}'

      - name: Sanitize arch/os and load into local docker daemon
        uses: ./
        with:
          imageTag: ghcr.io/${{ github.repository }}-test:${{ env.IMAGE_TAG }}
          targetImageTag: ghcr.io/${{ github.repository }}-test:sanitized
          publishTo: DockerDaemon

      - name: Inspect converted image platform
        run: |
          docker inspect ghcr.io/${{ github.repository }}-test:sanitized \
            --format 'converted: architecture={{.Architecture}} os={{.Os}}'
