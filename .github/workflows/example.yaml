name: Example - convert image for Kubernetes image volumes

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set image tag
        run: |
          DATE=$(date +%Y%m%d)
          REV=$((GITHUB_RUN_NUMBER))

          echo "DATE=$DATE" >> "$GITHUB_ENV"
          echo "REV=$REV" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=main-$DATE-$REV" >> "$GITHUB_ENV"

      - name: Set up Go for PR validation
        if: github.event_name == 'pull_request'
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'

      - name: Build image-volume-converter from source
        if: github.event_name == 'pull_request'
        run: go build -o "$RUNNER_TEMP/image-volume-converter" ./cmd/image-volume-converter

      - name: Set up Docker Buildx (multi-platform builder)
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          install: true

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./test/Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}-test:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Inspect original image platform
        run: |
          docker inspect ghcr.io/${{ github.repository }}-test:${{ env.IMAGE_TAG }} \
            --format 'original: architecture={{.Architecture}} os={{.Os}}'

      # The converted image declares os/arch "unknown", which Docker's classic
      # image store refuses to load (moby's image.CheckOS). containerd and the
      # Kubernetes kubelet accept it though.
      #
      # Pull requests validate the local source tree by compiling the converter
      # and invoking it directly; main/master pushes continue to exercise the
      # released action; releases publish the no-arch image to ghcr.io.
      - name: Remove os/arch from image and export OCI archive from source build
        if: github.event_name == 'pull_request'
        env:
          INPUT_IMAGE_TAG: ghcr.io/${{ github.repository }}-test:${{ env.IMAGE_TAG }}
          INPUT_PUBLISH_TO: OCIArchive:${{ runner.temp }}/no-arch.tar
          INPUT_GITHUB_ACTOR: ${{ github.actor }}
          INPUT_GITHUB_TOKEN: ${{ github.token }}
        run: "$RUNNER_TEMP/image-volume-converter"

      - name: Remove os/arch from image and export OCI archive using released action
        if: github.event_name != 'pull_request' && github.event_name != 'release'
        uses: ./
        with:
          imageTag: ghcr.io/${{ github.repository }}-test:${{ env.IMAGE_TAG }}
          publishTo: OCIArchive:${{ runner.temp }}/no-arch.tar

      - name: Ensure skopeo is installed
        if: github.event_name != 'release'
        run: |
          if ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y skopeo
          fi

      - name: Inspect converted image platform
        if: github.event_name != 'release'
        run: |
          skopeo inspect "oci-archive:${{ runner.temp }}/no-arch.tar" \
            --format 'converted: architecture={{.Architecture}} os={{.Os}}'

      - name: Remove os/arch from image and push to ghcr.io
        if: github.event_name == 'release'
        uses: ./
        with:
          imageTag: ghcr.io/${{ github.repository }}-test:${{ env.IMAGE_TAG }}
          outputImageTag: ghcr.io/${{ github.repository }}-test:no-arch
          publishTo: RemotePush
