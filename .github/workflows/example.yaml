name: Example - convert image for Kubernetes image volumes

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set image tag
        run: |
          DATE=$(date +%Y%m%d)
          REV=$((GITHUB_RUN_NUMBER))

          echo "DATE=$DATE" >> "$GITHUB_ENV"
          echo "REV=$REV" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=main-$DATE-$REV" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx (multi-platform builder)
        id: buildx
        uses: docker/setup-buildx-action@v2
        with:
          install: true

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./test/Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}-test:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Inspect original image platform
        run: |
          docker inspect ghcr.io/${{ github.repository }}-test:${{ env.IMAGE_TAG }} \
            --format 'original: architecture={{.Architecture}} os={{.Os}}'

      # The converted image declares os/arch "unknown", which Docker's classic
      # image store refuses to load (moby's image.CheckOS). containerd and the
      # Kubernetes kubelet accept it though.
      #
      # On pull requests and main-branch pushes: export an OCI archive and
      # verify the conversion with skopeo. On releases: push the sanitized
      # image to ghcr.io so it can be referenced by an image volume.
      - name: Sanitize arch/os and export OCI archive
        if: github.event_name != 'release'
        uses: ./
        with:
          imageTag: ghcr.io/${{ github.repository }}-test:${{ env.IMAGE_TAG }}
          publishTo: OCIArchive:${{ runner.temp }}/sanitized.tar

      - name: Ensure skopeo is installed
        if: github.event_name != 'release'
        run: |
          if ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y skopeo
          fi

      - name: Inspect converted image platform
        if: github.event_name != 'release'
        run: |
          skopeo inspect "oci-archive:${{ runner.temp }}/sanitized.tar" \
            --format 'converted: architecture={{.Architecture}} os={{.Os}}'

      - name: Sanitize arch/os and push to ghcr.io
        if: github.event_name == 'release'
        uses: ./
        with:
          imageTag: ghcr.io/${{ github.repository }}-test:${{ env.IMAGE_TAG }}
          outputImageTag: ghcr.io/${{ github.repository }}-test:sanitized
          publishTo: RemotePush
