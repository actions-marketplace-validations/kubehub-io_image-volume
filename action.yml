name: 'Image Volume Converter for Kubernetes'
description: >-
  Build a Kubernetes image volume: rewrite os/arch to unknown, solving arch
  mismatch and multi-arch problems for data volumes.
branding:
  icon: 'anchor'
  color: 'blue'

inputs:
  imageTag:
    description: >-
      Source image reference, e.g. ghcr.io/kubehub-io/docs:main-20260801-2.
      Searches the local docker daemon first; if absent, the image is pulled
      from its registry. Multi-arch images are resolved to the platform of the
      current runner.
    required: true
  outputImageTag:
    description: >-
      Destination image reference, e.g. ghcr.io/kubehub-io/docs:main-noarch.
      Used with publishTo: RemotePush. When omitted it defaults to the input
      imageTag with -noarch appended to its tag, so the converted image never
      overwrites the source.
    required: false
    default: ''
  publishTo:
    description: >-
      Where to put the converted image. RemotePush pushes it to outputImageTag;
      OCIArchive:<path> writes an OCI archive to the local file <path>.
      Defaults to RemotePush.
    required: false
    default: 'RemotePush'
  registryUsername:
    description: 'Username used to authenticate against the remote registry. Defaults to github.actor.'
    required: false
    default: ''
  registryPassword:
    description: >-
      Password/token used to authenticate against the remote registry. Defaults
      to secrets.GITHUB_TOKEN.
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Install image-volume-converter binary
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        ACTION_REPO: ${{ github.action_repository }}
      run: |
        set -euo pipefail

        REPO="${ACTION_REPO:-${GITHUB_REPOSITORY}}"
        case "$(uname -m)" in
          x86_64|amd64)  GOARCH=amd64 ;;
          aarch64|arm64) GOARCH=arm64 ;;
          armv7l)        GOARCH=armv7 ;;
          i386|i686)     GOARCH=386 ;;
          *) echo "::error::unsupported runner architecture $(uname -m)"; exit 1 ;;
        esac

        BIN="$RUNNER_TEMP/image-volume-converter"
        mkdir -p "$BIN"

        ASSET_URL="$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
          "https://api.github.com/repos/$REPO/releases/latest" \
          | jq -r --arg suffix "_linux_${GOARCH}" \
              '.assets[].browser_download_url | select(endswith($suffix))' \
          | head -n1 || true)"

        [[ -n "$ASSET_URL" ]] || { echo "::error::no linux/$GOARCH binary found in the latest release of $REPO"; exit 1; }

        curl -fSL "$ASSET_URL" -o "$BIN/image-volume-converter"
        chmod +x "$BIN/image-volume-converter"
        echo "image-volume-converter installed at $BIN/image-volume-converter" >> "$GITHUB_STEP_SUMMARY"

    - name: Rewrite arch/os to no-arch and publish image
      shell: bash
      env:
        INPUT_IMAGE_TAG: ${{ inputs.imageTag }}
        INPUT_OUTPUT_IMAGE_TAG: ${{ inputs.outputImageTag }}
        INPUT_PUBLISH_TO: ${{ inputs.publishTo }}
        INPUT_REGISTRY_USERNAME: ${{ inputs.registryUsername }}
        INPUT_REGISTRY_PASSWORD: ${{ inputs.registryPassword }}
        INPUT_GITHUB_ACTOR: ${{ github.actor }}
        INPUT_GITHUB_TOKEN: ${{ github.token }}
      run: "$RUNNER_TEMP/image-volume-converter/image-volume-converter"
